责、更热情。更重要的是，团队成员是真正的参与者，清楚整个团队协作的每一个环节，所以他们的意见或建议对团队项目的成功至关重要。如果领导不与成员讨论，他们可能做出糟糕的决定，最终给整个团队造成巨大损失。"}, {"n": 93, "idx": "093", "title": "093_part3带练91.m4a", "duration": 54.92, "q_en": "Nowadays, more men than women are leaders. Do you think this will change in the future?", "a_en": "Well, I think this will change in the future, but not too much. Although nowadays, women are more powerful and more capable than before, and they are also put in important positions. This is not the case in most situations. The truth is, men are still more competitive in job markets and most leaders are males because they are traditionally considered to be better at leading the group, to achieve the goal because they are more competitive and braver. Another important reason is that women are struggling with both their full-time jobs and family responsibilities. They hardly have time and opportunities to out-compete men. Therefore, there are still more male leaders than female leaders.", "q_zh": "如今男性领导比女性多。你认为将来会改变吗？", "a_zh": "嗯，我认为将来会改变，但不会太大。虽然如今女性比以前更有能力、更强大，也被放在重要位置，但大多数情况下并非如此。事实是，男性在就业市场上仍更有竞争力，大多数领导是男性，因为传统上他们被认为更擅长带领团队达成目标，因为他们更有竞争力、更勇敢。另一个重要原因是，女性要在全职工作和家庭责任之间挣扎，她们几乎没有时间和机会去胜过男性。因此，男性领导仍然比女性领导多。"}, {"n": 94, "idx": "094", "title": "094_part3带练92.m4a", "duration": 22.64, "q_en": "What kinds of films are popular in your country?", "a_en": "I think Hollywood movies and Disney movies are quite popular in China because they are about less serious topics. And the great sound and visual effects can always attract people a lot and make people relaxed and excited. And Chinese traditional action movies and comedies are also popular in many countries.", "q_zh": "你们国家流行什么样的电影？", "a_zh": "我认为好莱坞电影和迪士尼电影在中国相当流行，因为它们题材没那么严肃，而且出色的音效和视觉效果总能很吸引人，让人放松、兴奋。中国的传统动作片和喜剧在很多国家也很流行。"}, {"n": 95, "idx": "095", "title": "095_part3带练93.m4a", "duration": 27.75, "q_en": "What do you think makes a good film?", "a_en": "Firstly, a good story is a key determinant factor to a good film, a movie without a good story cannot be a good film. Secondly, the performance of actors and actress could make a film more appealing to audiences. Last but not least, the use of new technologies like new cameras and special effects can create better visual and sound effects making the film more successful.", "q_zh": "你认为什么造就了一部好电影？", "a_zh": "首先，好故事是决定一部好电影的关键因素，没有好故事的电影不可能是好电影。其次，演员的表演能让电影对观众更有吸引力。最后但同样重要的是，新技术的运用，比如新摄像机和特效，能创造更好的视觉和音响效果，让电影更成功。"}, {"n": 96, "idx": "096", "title": "096_part3带练94.m4a", "duration": 45.3, "q_en": "Why are special effects used in some movies?", "a_en": "I guess the main reason is that special effects like the use of 3D technology or visual reality can create an environment or atmosphere which enables the film viewers to be better involved in and concentrate on the story rather than be distracted from the main theme of the movie. More importantly special effects can simulate some dangerous scenes that can never be done by humans like the collision of two planes, the volcanic eruption or the explosion of the bomb, so it helps ensure the safety of actors or actresses.", "q_zh": "为什么有些电影会使用特效？", "a_zh": "我猜主要原因是，像 3D 技术或虚拟现实这样的特效可以创造一个环境或氛围，让观众更好地投入并专注于故事，而不是被电影主线以外的东西分心。更重要的是，特效可以模拟一些人类永远做不到的危险场景，比如两架飞机相撞、火山爆发或炸弹爆炸，所以它有助于保证演员的安全。"}, {"n": 97, "idx": "097", "title": "097_part3带练95.m4a", "duration": 57.61, "q_en": "Is the film industry important for a country?", "a_en": "Yeah, I think it is definitely important. First of all, film industry is an important economic sector in the country since it not only contributes much tax revenue to the government and creates numerous employment in the society, but also stimulates the development of other related industries such as technology companies, catering industry and cultural and creative industry. In addition, films and film related products can help spread the culture of a country to the young generations and foreigners, making more people interested and enthusiastic in the culture of this country. Moreover, watching films is a good way of relaxation for most people, so this film industry is also important in reaching people's leisure time.", "q_zh": "电影产业对一个国家重要吗？", "a_zh": "是的，我认为它绝对重要。首先，电影产业是国家重要的经济部门，因为它不仅为政府贡献大量税收、在社会中创造无数就业，还刺激其他相关产业的发展，比如科技公司、餐饮业和文创产业。此外，电影和电影相关产品能帮助把一个国家的文化传播给年轻一代和外国人，让更多人对这个国家的文化感兴趣、有热情。而且，看电影是大多数人放松的好方式，所以电影产业在丰富人们闲暇时间方面也很重要。"}, {"n": 98, "idx": "098", "title": "098_part3带练96.m4a", "duration": 35.5, "q_en": "Does friendship change as people grow older?", "a_en": "Yes, I do think friendship changes over time. Children may regard those people who enjoy playing with them or sharing toys with them and Candies with them as good friends. But to young adults, friendship means being helpful and trustworthy. Friends may offer help or give useful suggestions when they encounter some difficulties. And when people are in their 50s or 60s, friendship is more long lasting and brings those old people peace and happiness.", "q_zh": "友谊会随着人变老而改变吗？", "a_zh": "是的，我确实认为友谊会随时间改变。孩子可能把那些喜欢和他们玩、和他们分享玩具和糖果的人当作好朋友。但对年轻人来说，友谊意味着互助和信任，朋友在遇到困难时可能提供帮助或给出有用建议。当人们五六十岁时，友谊更持久，给那些老人带来平静和幸福。"}, {"n": 99, "idx": "099", "title": "099_part3带练97.m4a", "duration": 55.94, "q_en": "Is friendship more important to young people than old people?", "a_en": "Yeah, I guess so. The main reason is that old people are usually retired and isolated from most of their friends and they have fewer friends and They spend much more time with their family members. So family members are more important But young people in the competitive environment have to deal with different kinds of challenges and their friends could be great valuable personal resources Helping them a lot in their full-time study or work More importantly friends are more needed for young people since friends Not only make their life more interesting and exciting But the peer pressure could also motivate them to be more hardworking and persistent in achieving their personal goals And these are the reasons why I think friendship is more important to young people", "q_zh": "友谊对年轻人比老人更重要吗？", "a_zh": "是的，我猜是这样。主要原因是老人通常已退休，与大多数朋友疏远，朋友更少，他们花更多时间与家人在一起，所以家人更重要。而年轻人在竞争环境中要应对各种挑战，他们的朋友可能是很有价值的个人资源，在他们的全职学习或工作中帮助很大。更重要的是，年轻人更需要朋友，因为朋友不仅让他们的生活更有趣、更激动，同伴压力也能激励他们在实现个人目标时更勤奋、更坚持。这些就是我认为友谊对年轻人更重要的原因。"}, {"n": 100, "idx": "100", "title": "100_part3带练98.m4a", "duration": 49.67, "q_en": "Is social media important to friendship nowadays?", "a_en": "Yes, social media plays an important role in today's friendships. First of all, it is social media that makes the contact between friends frequent and direct. Never restricted by time or geographical locations. So social media shortens the distance and greatly strengthens the friendships. More importantly, people directly know what their friends are experiencing and thinking about by watching those photos, words and videos. So social media enables people to have a better understanding about their friends. Furthermore, social media expands people's friends circles, giving people an opportunity to socialize with people from different backgrounds or people with different hobbies.", "q_zh": "如今社交媒体对友谊重要吗？", "a_zh": "是的，社交媒体在当今的友谊中扮演重要角色。首先，正是社交媒体让朋友之间的联系频繁而直接，不受时间或地理位置的限制。所以社交媒体缩短了距离，大大加强了友谊。更重要的是，人们通过看那些照片、文字和视频，能直接知道朋友在经历什么、在想什么，所以社交媒体让人们更好地了解朋友。此外，社交媒体扩大了人们的交友圈，给人们机会与不同背景或不同爱好的人交往。"}, {"n": 101, "idx": "101", "title": "101_part3带练99.m4a", "duration": 43.07, "q_en": "Is it important to have dinner with the family?", "a_en": "Yes, it is quite important especially during traditional festivals and important celebrations. The main reason is that having dinner with the family together offers opportunities for family members to get together and have talks that can communicate with each other face to face instead of sending text messages or talking on the phone. The relationship will be improved and the family bones will be strengthened. More importantly, when eaten with family members, people may feel warm, relaxed and happy. Forgetting worries in their full-time job or work. Having dinner with the family is a good cure for most modern people.", "q_zh": "和家人一起吃饭重要吗？", "a_zh": "是的，尤其是在传统节日和重要庆典期间相当重要。主要原因是，和家人一起吃饭提供了家庭成员聚在一起交谈的机会，可以面对面交流，而不是发短信或打电话。关系会改善，家庭纽带会加强。更重要的是，和家人一起吃饭时，人们会感到温暖、放松、快乐，忘掉全职工作或学习中的烦恼。和家人一起吃饭是大多数现代人的一剂良药。"}, {"n": 102, "idx": "102", "title": "102_part3带练100.m4a", "duration": 38.76, "q_en": "Why do you think many families are less likely to eat together?", "a_en": "Well, I think it is Primarily because of the lack of time, you know now. There's everyone in the family is busy and fully occupied by He is a hard work or study and people spend much time on business trips or group meetings And they don't have time to eat with their family Another important reason is that family members normally study or work in different cities or even in Different countries they are isolated by the distance so there are fewer chances for the family to eat together", "q_zh": "你认为为什么很多家庭较少一起吃饭？", "a_zh": "嗯，我认为主要是因为缺乏时间。现在家里每个人都很忙，被辛苦的工作或学习占满，人们花很多时间出差或开小组会议，没有时间和家人一起吃饭。另一个重要原因是，家庭成员通常在不同的城市甚至不同的国家学习或工作，被距离隔开，所以家人一起吃饭的机会更少。"}, {"n": 103, "idx": "103", "title": "103_part3带练101.m4a", "duration": 51.2, "q_en": "Do people prefer to read in the library?", "a_en": "Yes, I think so. First of all, except libraries in the schools or colleges. Many small libraries have been put into use in communities or nearby neighborhoods. So people can easily get access to and read in those libraries. On top of that, there are many advantages in reading in the libraries. For example, the library is quiet and peaceful. People can better concentrate on their reading instead of being influenced by other distractions when they are reading in their own homes. And there is a wider range of books in the various subjects in the library. It is usually free to the public open throughout the year and can be easily reached by public transport. So people prefer to read in the library.", "q_zh": "人们喜欢在图书馆读书吗？", "a_zh": "是的，我认为是的。首先，除了学校或大学里的图书馆，很多社区或附近街区也建起了小型图书馆，所以人们可以方便地到那些图书馆阅读。除此之外，在图书馆阅读有很多好处。比如，图书馆安静平和，人们能更好地专注阅读，而不像在自己家读书时被其他干扰影响。而且图书馆里有各种学科、范围更广的书籍，通常对公众免费开放、全年无休，乘公共交通也容易到达。所以人们喜欢在图书馆阅读。"}];
const LS = 'ielts_p3_done_v1';
let done = new Set(JSON.parse(localStorage.getItem(LS) || '[]'));
let showZh = true, onlyQ = false;

const list = document.getElementById('list');
const meta = document.getElementById('meta');
const totalMin = (DATA.reduce((s,x)=>s+x.duration,0)/60).toFixed(0);
meta.textContent = `共 ${DATA.length} 条 · 约 ${totalMin} 分钟 · 已掌握 ${done.size}`;

function render(){
  const kw = document.getElementById('q').value.trim().toLowerCase();
  const html = DATA.filter(x=>{
    if(!kw) return true;
    return ((x.q_en+x.a_en+x.q_zh+x.a_zh+x.idx).toLowerCase()).includes(kw);
  }).map(x=>{
    const isDone = done.has(x.idx);
    return `<div class="card ${isDone?'done':''}" id="c${x.n}">
      <div class="head">
        <span class="num">${x.idx}</span>
        <span class="dur">${Math.round(x.duration)}s</span>
        <span class="mark ${isDone?'on':''}" data-idx="${x.idx}" title="标记已掌握">★</span>
      </div>
      ${x.q_en?`<div class="q">${x.q_en}</div>`:''}
      ${x.q_zh?`<div class="q-zh">${x.q_zh}</div>`:''}
      ${onlyQ?'':`
        <div class="lbl">参考答案</div>
        <div class="en">${x.a_en}</div>
        <div class="zh ${showZh?'':'hide'}">${x.a_zh||'（暂无中文对照）'}</div>
      `}
    </div>`;
  }).join('');
  list.innerHTML = html || '<div class="empty">没有匹配的条目</div>';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('tzh').addEventListener('click', e=>{
  showZh = !showZh; e.target.classList.toggle('on', showZh);
  document.querySelectorAll('.zh').forEach(el=>el.classList.toggle('hide', !showZh));
});
document.getElementById('tq').addEventListener('click', e=>{
  onlyQ = !onlyQ; e.target.classList.toggle('on', onlyQ); render();
});
list.addEventListener('click', e=>{
  const m = e.target.closest('.mark'); if(!m) return;
  const id = m.dataset.idx;
  if(done.has(id)) done.delete(id); else done.add(id);
  localStorage.setItem(LS, JSON.stringify([...done]));
  m.classList.toggle('on'); m.closest('.card').classList.toggle('done');
  meta.textContent = `共 ${DATA.length} 条 · 约 ${totalMin} 分钟 · 已掌握 ${done.size}`;
});
addEventListener('scroll', ()=>document.getElementById('toTop').classList.toggle('show', scrollY>600));
render();
</script>
</body>
</html>
