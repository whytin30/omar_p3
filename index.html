<script>
const DATA = [{"n": 1, "idx": "001", "title": "001_part3带练1.m4a", "duration": 30.86, "q_en": "Why do people like to have private cars?", "a_en": "Well, I think for most people, the main reason that a private car is a tool that is very convenient, efficient and flexible than other transportation means. They can drive private cars to faraway places to go to work or study and another reason is that some people regard private cars as a symbol of their wealth and social status and like to buy some cars that are expensive or even luxurious.", "q_zh": "为什么人们喜欢拥有私家车？", "a_zh": "嗯，我认为对大多数人来说，主要原因在于私家车是一种比其他交通方式更便利、高效、灵活的工具。他们可以开车去很远的地方上班或上学；另一个原因是，有些人把私家车看作财富和社会地位的象征，喜欢买那些昂贵甚至豪华的车。"}, {"n": 2, "idx": "002", "title": "002_part3带练2.m4a", "duration": 48.14, "q_en": "What are the differences between bicycles and private cars?", "a_en": "Well, I think the first difference is about their flexibility Private cars apparently are more convenient flexible and useful We can drive our cars too far where places on rainy days or bad weather on the contrary Bicycles are not that safe and it's inconvenient for us to ride a bicycle on rainy days Another difference is that bicycles are green transport and more eco-friendly But private cars rely on fossil fuels like petrol or natural gas, so they produce exhaust gas and cause air pollution And this is also the reason why people are encouraged to reduce the use of private cars", "q_zh": "自行车和私家车之间有什么区别？", "a_zh": "嗯，我认为第一个区别在于灵活性。私家车显然更方便、灵活、实用——下雨天或恶劣天气时，我们可以开车去很远的地方。相反，自行车就没那么安全，下雨天骑车也很不方便。另一个区别是，自行车是绿色交通，更环保；而私家车依赖汽油、天然气等化石燃料，会排放尾气、造成空气污染。这也是人们被鼓励少用私家车的原因。"}, {"n": 3, "idx": "003", "title": "003_part3带练3.m4a", "duration": 52.69, "q_en": "What is the difference between men and women's preference on cars?", "a_en": "I think first the main difference is that a main may prefer cars that are more functional and practical. They prefer cars which have larger engine, lower oil consumption and bigger space. They choose cars which are most cost effective and have the best performance. But for women, they may think fancy appearance and price are much more important. So they are more likely to buy cars like Beatles or Mini Cooper. Another difference is that men are more interested in cars which have new technologies and new designs. So they can have an enjoyable driving experience but women are more conservative and make choose cars which have good reputations or cars of famous brands.", "q_zh": "男性和女性在汽车偏好上有什么区别？", "a_zh": "我认为首先主要区别是，男性可能更喜欢功能性、实用性更强的车。他们偏好发动机更大、油耗更低、空间更大的车，选择性价比最高、性能最好的车。但对女性来说，她们可能觉得外观和价格更重要，所以更倾向于买像甲壳虫或 Mini Cooper 那样的车。另一个区别是，男性对采用新技术、新设计的车更感兴趣，这样能有愉快的驾驶体验；而女性更保守，可能会选择口碑好或名牌的车。"}, {"n": 4, "idx": "004", "title": "004_part3带练4.m4a", "duration": 39.87, "q_en": "What will cars be like in the future?", "a_en": "Well firstly, I think of course cars will be more environmentally friendly no longer powered by fossil fuels but clean energy like electricity or solar power. I think in the near future there will be driverless cars cars can be driven and controlled by apps on smartphones. We don't need to drive cars by ourselves driving will be more enjoyable and easier and I hope that one day in the future cars can just be more functional like Transformers they can both fly in the sky and move like submarines on the water", "q_zh": "未来的汽车会是什么样？", "a_zh": "嗯，首先我认为汽车当然会更环保，不再用化石燃料，而是用电力、太阳能等清洁能源。我想在不久的将来会出现无人驾驶汽车，可以通过智能手机上的 App 来驾驶和控制。我们不需要自己开车，驾驶会变得更愉快、更简单。我希望将来有一天，汽车能更像变形金刚那样功能多样——既能飞上天空，也能像潜水艇一样在水里行驶。"}, {"n": 5, "idx": "005", "title": "005_part3带练5.m4a", "duration": 46.51, "q_en": "Do you think people need to wear formally in workplace?", "a_en": "What I think that is really a good idea because firstly it will make the management much easier Since we can clearly know why employees position and job duty just from the clothes he or she wears and For employees, they don't need to waste a lot of time choosing clothes So they can just concentrate better on the work and become more productive More importantly, dressing formally is a kind of behavior showing the respect your clients and the identities of the companies And they usually look more professional, reliable, and trustworthy But I think for the IT companies which value creativity and innovation very much the employees don't need to dress formally", "q_zh": "你认为人们在职场需要穿正装吗？", "a_zh": "我认为这确实是个好主意，因为首先它会让管理容易得多——只从员工穿的衣服就能清楚知道他的职位和工作职责。对员工来说，他们不用浪费大量时间挑衣服，可以更专注于工作、效率更高。更重要的是，穿正装是一种行为，体现了对客户的尊重和公司的身份，他们通常看起来更专业、可靠、值得信赖。但我认为对于非常看重创意与创新的 IT 公司来说，员工不需要穿正装。"}, {"n": 6, "idx": "006", "title": "006_part3带练6.m4a", "duration": 34.72, "q_en": "Why do some people like to wear traditional clothes?", "a_en": "What I guess some people like dressing traditionally because they just like traditional arts like traditional music and traditional hour crafts So they may prefer traditional clothes such as cheap or some clothes that are made from silk Secondly, wearing traditional clothes is a kind of behavior showing the sense of ritual in some important festivals and ceremonies So it is quite common to see people wear traditional clothes at weddings at spring festival or some traditional festivals", "q_zh": "为什么有些人喜欢穿传统服饰？", "a_zh": "我猜有些人喜欢穿传统服饰，是因为他们就是喜欢传统艺术，比如传统音乐和传统手工艺，所以他们可能偏爱传统服装，比如旗袍或用丝绸做的衣服。其次，在一些重要节日和庆典上穿传统服饰是一种体现仪式感的行为，所以在婚礼、春节或一些传统节日上看到人们穿传统服饰是相当常见的。"}, {"n": 7, "idx": "007", "title": "007_part3带练7.m4a", "duration": 30.44, "q_en": "Do you think traditional clothes will disappear in the future?", "a_en": "No, I don't think so. Although nowadays a lot of people especially young people like to dress in the modern fashion and dress more casually. I don't think traditional dressing culture will completely disappear in the future because it's a symbol of traditional culture and traditional arts. As I've mentioned before people prefer to dress traditionally in important ceremonies, so traditional clothes will never disappear in the future.", "q_zh": "你认为传统服饰将来会消失吗？", "a_zh": "不，我不这么认为。虽然现在很多人，尤其是年轻人，喜欢穿现代时装、穿得更休闲，但我认为传统服饰文化将来不会完全消失，因为它是传统文化和传统艺术的象征。正如我之前提到的，人们在重要庆典上更愿意穿传统服饰，所以传统服饰将来永远不会消失。"}, {"n": 8, "idx": "008", "title": "008_part3带练8.m4a", "duration": 28.68, "q_en": "Do old people change their style of dressing?", "a_en": "Yeah, I think they will change their dressing styles because the social environment and fashion trains are also changing So they'll follow the trend and change their dressing styles And another fact is that old people's body shapes are also changing as a grow older So they prefer some comfortable or traditional clothes when they are old instead of wearing jeans and t-shirts as they used to", "q_zh": "老年人的穿衣风格会改变吗？", "a_zh": "会，我认为他们会改变穿衣风格，因为社会环境和时尚潮流也在变化，所以他们会跟随潮流改变穿衣风格。另一个事实是，随着年龄增长，老年人的体型也在变化，所以他们老了以后更喜欢舒适或传统的衣服，而不是像以前那样穿牛仔裤和 T 恤。"}, {"n": 9, "idx": "009", "title": "009_part3带练9.m4a", "duration": 34.2, "q_en": "What do you think is the best way to know foreign culture?", "a_en": "What I think the best way to know foreign culture must be traveling, working, or studying in a foreign country. This is because people could personally experience the culture, talk to the locals, and work with different kinds of people in the country, which is more impressive and more appealing. And the information from online books are usually old and outdated. So people can surely and better understand foreign culture by taking the trip to a foreign country.", "q_zh": "你认为了解外国文化最好的方式是什么？", "a_zh": "我认为了解外国文化最好的方式一定是在外国旅行、工作或学习。因为人们可以亲身感受文化、和当地人交谈、和这个国家不同类型的人共事，这更令人印象深刻、更有吸引力。而网络和书本上的信息通常陈旧过时。所以，人们通过去外国旅行，一定能更好、更准确地理解外国文化。"}, {"n": 10, "idx": "010", "title": "010_part3带练10.m4a", "duration": 37.78, "q_en": "What do you think is the biggest problem to work in the foreign country?", "a_en": "Well, I think the biggest problem must be the language barrier, you know When we are working in a foreign country, we have to communicate with our colleagues and with the locals in foreign languages So if we are not good at this foreign language, there will be some misunderstandings in work that could possibly cause some arguments Another problem is cultural differences. We come from different countries, different backgrounds, and we have different thoughts and ideas towards similar problems So maybe sometimes people will feel isolated when they are working in a foreign country", "q_zh": "你认为在外国工作最大的问题是什么？", "a_zh": "嗯，我认为最大的问题一定是语言障碍。当我们在外国工作时，必须用外语和同事、当地人交流。所以如果我们不擅长这门外语，工作中就会出现一些误解，甚至可能引发争论。另一个问题是文化差异。我们来自不同国家、不同背景，对相似问题有不同想法和观点，所以有时人们在外国工作时会感到孤立。"}, {"n": 11, "idx": "011", "title": "011_part3带练11.m4a", "duration": 40.66, "q_en": "Some people say reading is the best way to know about a culture. Do you agree?", "a_en": "I personally disagree with this statement. You know, reading is just the writer's description, and they are all about the writer's ideas and thoughts, not my personal experience of feelings. And more importantly, information in the reading materials like some classic literature work is out of date and out-fashioned. Instead, I think traveling, as I've mentioned before, is the best way to know about a foreign culture. We can experience everything like the cuisine and living habits by ourselves in person, so we can have a better understanding about the foreign culture.", "q_zh": "有人说阅读是了解一种文化最好的方式。你同意吗？", "a_zh": "我个人不同意这种说法。阅读只是作者的描述，都是作者的想法和思考，而不是我个人的体验和感受。更重要的是，阅读材料——比如一些经典文学作品——里的信息已经过时、陈旧了。相反，我认为正如我之前提到的，旅行才是了解外国文化最好的方式。我们可以亲身经历美食、生活习惯等一切，从而更好地理解外国文化。"}, {"n": 12, "idx": "012", "title": "012_part3带练12.m4a", "duration": 33.97, "q_en": "Do you think everyone shares a similar definition of happiness?", "a_en": "Well, I don't think so. I think everyone has different definitions of happiness because everyone has different experience and comes from different backgrounds. Of course, they may define happiness in different ways. There are also at different ages have different occupations and different personalities. For example, some people consider material wealth as the key to happiness, but others may feel delighted and happy when they are mentally satisfied.", "q_zh": "你认为每个人对幸福的定义都相似吗？", "a_zh": "嗯，我不这么认为。我认为每个人对幸福的定义都不同，因为每个人都有不同的经历、来自不同的背景，当然会用不同的方式定义幸福。人们在不同的年龄也有不同的职业和性格。比如，有些人认为物质财富是幸福的关键，但也有人在精神上得到满足时感到快乐和幸福。"}, {"n": 13, "idx": "013", "title": "013_part3带练13.m4a", "duration": 37.13, "q_en": "Some people say that living in the big city is quite boring. Do you think so?", "a_en": "No, I disagree. I think living in a big city is interesting, challenging and exciting. There are a lot of amazing facilities and infrastructure in cities like cinemas, concert halls, and fitness centers, which can make our life more colorful. More importantly, there are more job opportunities in the big city. And we are in a rapidly changing environment. People living in big cities may feel excited and motivated, working hard to fulfill their dreams and achieve their goals.", "q_zh": "有人说住在大城市很无聊。你这么认为吗？", "a_zh": "不，我不同意。我认为住在大城市有趣、有挑战性、令人兴奋。城市里有很多很棒的设施和基础设施，比如电影院、音乐厅和健身中心，可以让我们的生活更丰富多彩。更重要的是，大城市有更多工作机会，我们处在快速变化的环境中。住在大城市的人可能会感到兴奋和有动力，努力工作去实现梦想、达成目标。"}, {"n": 14, "idx": "014", "title": "014_part3带练14.m4a", "duration": 28.82, "q_en": "How can we make children happy?", "a_en": "Well, I think the easiest way is to give them some rewards, especially physical rewards such as toys, candies, and permission to watch TV shows. This can make them happy directly, and of course parents' company and encouragement can delight children. Also, children may feel happy when they get some achievements like winning prizes and in competitions or making a big progress in study.", "q_zh": "我们怎样才能让孩子开心？", "a_zh": "嗯，我认为最简单的方法就是给他们一些奖励，尤其是物质奖励，比如玩具、糖果，以及允许他们看电视节目。这能直接让他们开心。当然，父母的陪伴和鼓励也能让孩子快乐。此外，孩子取得一些成就时——比如赢得比赛奖项或学习上取得很大进步——也会感到开心。"}, {"n": 15, "idx": "015", "title": "015_part3带练15.m4a", "duration": 43.72, "q_en": "What's the difference between children's happiness and adults happiness?", "a_en": "Firstly, I think children's happiness is much simpler. When their needs and curiosity is are satisfied, they can always be happy. Just like I've mentioned, candy is toys and exciting games can make them happy. But for adults, I'd say it's more difficult to fulfill their needs. They often feel quite stressful and their life is busy. And the other difference is that those happiness is more related to material wealth. When they buy a new house or get a big promotion career, they can feel happy. But children's happiness is more about emotions and their feelings.", "q_zh": "孩子的快乐和大人的快乐有什么区别？", "a_zh": "首先，我认为孩子的快乐要简单得多。当他们的需求和好奇心得到满足时，他们总能开心。就像我提到的，糖果、玩具和刺激的游戏就能让他们开心。但对大人来说，我会说满足他们的需求更难。他们常常感到压力很大，生活很忙。另一个区别是，大人的快乐更与物质财富相关——当他们买了新房或事业上获得大晋升时，他们会感到开心。而孩子的快乐更多关乎情感和感受。"}, {"n": 16, "idx": "016", "title": "016_part3带练16.m4a", "duration": 36.53, "q_en": "What can governments do to improve people's health?", "a_en": "Well, I think the first one is to help raise the public health awareness by teaching citizens to improve their health by doing different kinds of exercise and encouraging citizens to abandon living habits that are harmful to their health. And governments should also make sure food is clean and safe and the environment is pollution free because food and environment directly influence people's health. Building more sports and health facilities is another useful method in improving people's health.", "q_zh": "政府能做些什么来改善人们的健康？", "a_zh": "嗯，我认为第一是通过教市民通过做各种运动来改善健康、鼓励市民戒除有害健康的生活习惯，来帮助提高公众健康意识。政府还应确保食品安全清洁、环境无污染，因为食物和环境直接影响人们的健康。建设更多运动和健康设施是改善人们健康的另一个有效方法。"}, {"n": 17, "idx": "017", "title": "017_part3带练17.m4a", "duration": 28.45, "q_en": "What activities can the school organize for children to keep fit?", "a_en": "Well, I think the school should organize sports activities or competitions and make them more attractive and interactive So children will be more encouraged to do sports to keep fit PE class is also a good way to help children keep fit because it is a compulsory course and all the children are required to do physical exercise", "q_zh": "学校可以组织哪些活动帮孩子保持健康？", "a_zh": "嗯，我认为学校应该组织体育活动或比赛，并把它们办得更有吸引力、更具互动性，这样孩子们会更有动力去做运动保持健康。体育课也是帮孩子保持健康的好方法，因为它是必修课，所有孩子都被要求进行体育锻炼。"}, {"n": 18, "idx": "018", "title": "018_part3带练18.m4a", "duration": 36.53, "q_en": "How can you tell whether a website is reliable or not?", "a_en": "The first method is to see if it's asking you for too much personal information like your identification card number, phone number, birth date, and living address because reliable websites help protect users' privacy. Another thing is we should make sure we're logging in in official websites. The third thing is that when you are visiting a website if advertisements or other links frequently pop up, it means this website is not reliable but too disturbing.", "q_zh": "你怎么判断一个网站是否可靠？", "a_zh": "第一个方法是看它是否向你索取过多个人信息，比如身份证号、电话号码、出生日期和住址，因为可靠的网站会帮助保护用户隐私。另一件事是，我们应确保登录的是官方网站。第三，当你在浏览一个网站时，如果广告或其他链接频繁弹出，说明这个网站不可靠，而且太扰人。"}, {"n": 19, "idx": "019", "title": "019_part3带练19.m4a", "duration": 35.64, "q_en": "Do you think people are healthier now than in the past?", "a_en": "Yes, I think there are. Firstly, people nowadays generally live longer than people in the past. Secondly, the living conditions and medical treatment are much better. Many diseases even cancers are early stage can be effectively cured. Thirdly, people's health awareness is greatly enhanced and they're trying to keep fit in different ways such as doing sports, eating healthy food, like low calorie food, vegetables and fruits, and abandoning harmful living habits like smoking.", "q_zh": "你认为现在的人比过去更健康吗？", "a_zh": "是的，我认为是的。首先，现在的人总体上比过去的人寿命更长。其次，生活条件和医疗水平好得多，很多疾病甚至早期癌症都能被有效治愈。第三，人们的健康意识大大增强，他们在尝试用不同方式保持健康，比如做运动、吃健康食品（如低热量食物、蔬菜水果），以及戒除吸烟等有害的生活习惯。"}, {"n": 20, "idx": "020", "title": "020_part3带练20.m4a", "duration": 38.01, "q_en": "Why do some people enjoy extreme sports?", "a_en": "What I guess the most important reason is that those extreme sports like surfing, diving and bungee jumping are extremely exciting and challenging. When people finish this kind of extreme sports, they will always feel excited and you get a great sense of achievement. And I think another reason is that some people can't find exciting points in their daily normal life and really want to find a way to escape from the boring, stressing life, so they would like to do extreme sports which are more challenging and more exciting.", "q_zh": "为什么有些人喜欢极限运动？", "a_zh": "我猜最重要的原因是，冲浪、潜水、蹦极这类极限运动极其刺激、有挑战性。当人们完成这类极限运动时，总会感到兴奋，并从中获得巨大的成就感。我认为另一个原因是，有些人在日常平凡生活中找不到兴奋点，很想找个方式逃离无聊、高压的生活，所以他们愿意做那些更有挑战性、更刺激的极限运动。"}, {"n": 21, "idx": "021", "title": "021_part3带练21.m4a", "duration": 32.02, "q_en": "Are action films popular in your country?", "a_en": "I think action films must be one of the most popular genres of films in China and there are a lot of action movie stars like Jackie Chan and Bruce Lee who have a lot of fans in my country. And also, a lot of people really want to enjoy action movies, especially young people because watching action movies is a good relaxation which can always make people excited and thrilled. Help them forget the worries and pressure in the work or study.", "q_zh": "动作片在你们国家受欢迎吗？", "a_zh": "我认为动作片一定是中国最受欢迎的电影类型之一，有很多动作片明星，比如成龙和李小龙，在你们国家有很多粉丝。而且，很多人真的很喜欢看动作片，尤其是年轻人，因为看动作片是一种很好的放松方式，总能让人兴奋、激动，帮助他们忘掉工作或学习中的烦恼和压力。"}, {"n": 22, "idx": "022", "title": "022_part3带练22.m4a", "duration": 40.47, "q_en": "Do you think it is a good thing that a leader likes taking risks?", "a_en": "Well from the perspective of employees, I think it is not a good thing because taking risks means the business will be less stable and There are some dangers and difficulties when the leader likes taking risks And it may even cause some bigger problems. For example, the company may suffer great loss The employees may reduce their loyalty and enthusiasm in their work Although taking risks may bring about more opportunities, the priority for the leader is to ensure employees job security, and smooth development of the company", "q_zh": "你认为一个喜欢冒险的领导是件好事吗？", "a_zh": "嗯，从员工的角度看，我认为这不是好事，因为冒险意味着生意会不那么稳定，领导喜欢冒险时会带来一些危险和困难，甚至可能引发更大的问题。比如，公司可能遭受巨大损失，员工可能降低对工作的忠诚度和热情。虽然冒险可能带来更多机会，但领导的首要任务是确保员工的工作保障和公司的平稳发展。"}, {"n": 23, "idx": "023", "title": "023_part3带练23.m4a", "duration": 46.05, "q_en": "Do you think men and women will make a different choice about risk-taking?", "a_en": "Yeah, I think so due to biological differences men are more likely to take risks because they're braver and more courageous in taking risks. On the other hand women prefer a stable life without many changes, so they're less likely to take risks. Another reason is that men usually have full-time jobs and they probably have more social and life experience than women. They know what the consequences would be if they take risks, but for women most of them are housewives and have more concerns, so when they're taking a risk they may consider more like their family and children.", "q_zh": "你认为男性和女性在冒险上会做不同的选择吗？", "a_zh": "是的，我认为会。由于生理差异，男性更可能冒险，因为他们更勇敢、更有胆量去冒险。另一方面，女性偏爱没有太多变化的稳定生活，所以她们不太可能冒险。另一个原因是，男性通常有全职工作，可能有比女性更多的社会和生活经验，他们知道冒险会有什么后果；而对女性来说，她们大多是家庭主妇，有更多牵挂，所以冒险时可能会更多地考虑家庭和孩子。"}, {"n": 24, "idx": "024", "title": "024_part3带练24.m4a", "duration": 30.63, "q_en": "Do you think it is necessary to have laws on the use of mobile phones?", "a_en": "What I personally don't think this is a good idea because the use of mobile phone is kind of personal right Apparently we have freedom to use mobile phones in different kinds of occasions But I think we should have some regulations or reminders for mobile phone users For example, we can't speak loudly if we are using our mobile phones and we should switch to silent mode in public places We can't use our mobile phone because we are using our mobile phones and we should switch to silent mode in public places", "q_zh": "你认为有必要制定使用手机的法律吗？", "a_zh": "我个人不认为这是个好主意，因为使用手机算是一种个人权利，显然我们有自由在不同场合使用手机。但我认为我们应该对手机使用者有一些规定或提醒。比如，我们不能在使用手机时大声讲话，在公共场所应该把手机调到静音模式。"}, {"n": 25, "idx": "025", "title": "025_part3带练25.m4a", "duration": 36.48, "q_en": "How do you like children having mobile phones?", "a_en": "I? Don't think it is a good thing that children have mobile phones because mobile phone is a big distraction and annoying disturbance It will lead children to spend too much time playing video games instead of doing outdoor activities So it may cost bad eyesight and they would not spend much time on reading and interacting with other children So I think mobile phones to children is a kind of harm and would never bring benefit to them because they are too young and they are at a very young age", "q_zh": "你怎么看孩子拥有手机这件事？", "a_zh": "我不认为孩子拥有手机是件好事，因为手机是很大的干扰和恼人的麻烦。它会让孩子花太多时间玩电子游戏，而不是做户外活动，所以可能导致视力变差，他们也不会花太多时间阅读和与其他孩子互动。所以我认为手机对孩子是一种伤害，永远不会给他们带来好处，因为他们还太小、年龄很小。"}, {"n": 26, "idx": "026", "title": "026_part3带练26.m4a", "duration": 42.61, "q_en": "At what age should children have mobile phones?", "a_en": "I think children above 12 could have their own mobile phones because at that age, they have already finished elementary education, have sufficient self-control ability. Now how to control these use of mobile phones can distinguish right from wrong, so they can use mobile phones in a proper way and are not negatively influenced. And mobile phones can be an important tool for children above 12 because there are many useful functions that makes children's life convenient, safe and interesting like making phone calls, searching for useful information or doing study online.", "q_zh": "孩子应该几岁拥有手机？", "a_zh": "我认为 12 岁以上的孩子可以拥有自己的手机，因为那个年龄他们已经完成小学教育，有足够的自控力，懂得如何控制手机的使用、能分辨对错，所以能恰当使用手机、不受负面影响。而且手机对 12 岁以上的孩子可以是个重要工具，有很多实用功能让孩子的生活方便、安全、有趣，比如打电话、搜索有用信息或在线学习。"}, {"n": 27, "idx": "027", "title": "027_part3带练27.m4a", "duration": 37.18, "q_en": "Are people plighter now than in the past?", "a_en": "Yes, I think so people now are much plighter than in the past now. These people are Better educated and morals are also improved a lot So they mainly demonstrate behaviors that are accepted by the society and are polite to others People now these are more willing to help others so do volunteer work many people now These are well educated and they even have moral classes in school We are also used to greeting others politely and not speaking loudly or rudely in public places", "q_zh": "现在的人比过去更有礼貌吗？", "a_zh": "是的，我认为现在的人比过去有礼貌得多。现在的人受教育程度更高，道德也大大提升，所以他们主要表现出被社会接受的行为，对他人有礼貌。现在的人更愿意帮助他人、做志愿者工作。很多人受过良好教育，学校里甚至还有道德课。我们也习惯于礼貌地和人打招呼，不在公共场所大声讲话或粗鲁无礼。"}, {"n": 28, "idx": "028", "title": "028_part3带练28.m4a", "duration": 41.08, "q_en": "What kind of place can be regarded as good-lingling places?", "a_en": "Why I think good-lingling places are not determined by a single factor, but by a combination of different elements? Firstly, there should be as a fairable pollution-free and peaceful environment, so that people will not be negatively influenced by pollution or noises. Secondly, good public facilities such as efficient public transport, hospitals, and leisure entertainment facilities also make some places better-lingling places. Last but not least, a good-lingling place should be safe, and the close relationship with neighbors are also important factors in improving people's life quality and happiness.", "q_zh": "什么样的地方可以被称为宜居的地方？", "a_zh": "我认为宜居的地方不是由单一因素决定的，而是由不同要素组合而成。首先，应该有相当无污染、宁静的环境，这样人们不会受到污染或噪音的负面影响。其次，良好的公共设施，比如高效的公共交通、医院和休闲娱乐设施，也会让一些地方成为更宜居的地方。最后但同样重要的是，宜居的地方应该安全，与邻居关系亲近也是提升人们生活质量和幸福感的重要因素。"}, {"n": 29, "idx": "029", "title": "029_part3带练29.m4a", "duration": 40.75, "q_en": "Do people in your country prefer to live in apartments or houses?", "a_en": "I think most Chinese people prefer to live in apartments because most apartments are constructed in city where people can easily get access to efficient transport in other public facilities Which of course make their life and work easier and more convenient, but most houses are located in suburbs far away from the city Another reason is a realistic one simply because houses are extremely expensive and cannot be afforded by most Chinese families and there are smaller families nowadays Young people are not living with the old generation, so there's no need to live in big houses", "q_zh": "你们国家的人更喜欢住公寓还是房子？", "a_zh": "我认为大多数中国人更喜欢住公寓，因为大多数公寓建在城市里，人们可以方便地使用高效交通和其他公共设施，这当然让他们的生活和工作更轻松方便；而大多数房子位于远离城市的郊区。另一个原因是现实考虑——房子极其昂贵，大多数中国家庭负担不起。而且现在家庭规模更小，年轻人不和长辈住在一起，所以没必要住大房子。"}, {"n": 30, "idx": "030", "title": "030_part3带练30.m4a", "duration": 39.96, "q_en": "Why do you think some people prefer to live in the countryside?", "a_en": "I think the main reason is that the environment in the countryside is less noisy and less crowded, and people can get close to a natural environment without pollutions. More importantly, those people prefer to slow-paced life in the countryside. They can escape from the busy stressful city life and enjoy a peaceful care-free life. For example, we usually see some old retired people building a house in the countryside and live peacefully and regularly, developing their own hobbies and without worries about the fierce competitions and high living costs.", "q_zh": "你认为为什么有些人更喜欢住在乡下？", "a_zh": "我认为主要原因是乡下的环境没那么吵、没那么拥挤，人们可以接近没有污染的自然环境。更重要的是，这些人偏好乡下慢节奏的生活，他们可以逃离忙碌高压的城市生活，享受宁静无忧的生活。比如，我们常看到一些退休老人到乡下建房子，平静而有规律地生活，培养自己的爱好，不用担忧激烈的竞争和高昂的生活成本。"}, {"n": 31, "idx": "031", "title": "031_part3带练31.m4a", "duration": 44.05, "q_en": "Should old buildings be preserved?", "a_en": "Yeah, definitely. First of all, old buildings are of great historical values to a country because there are typical buildings in that historical period and they represent a unique architecture style protecting those old buildings means preserving traditional culture. If all the old buildings were demolished and replaced by modern buildings, it would be a great loss to the preservation of local culture. Moreover, old buildings can be developed as good tourist attractions and be an important part of local tourism. So why not preserve those old buildings since they can also create huge economic profits at the same time?", "q_zh": "老建筑应该被保护吗？", "a_zh": "是的，当然应该。首先，老建筑对一个国家有巨大的历史价值，因为它们是那个历史时期的典型建筑，代表独特的建筑风格，保护这些老建筑就意味着保护传统文化。如果所有老建筑都被拆掉、换成现代建筑，对当地文化的保存将是巨大损失。此外，老建筑可以开发成很好的旅游景点，成为当地旅游业的重要组成部分。既然它们还能同时创造巨大的经济利润，为什么不保护它们呢？"}, {"n": 32, "idx": "032", "title": "032_part3带练32.m4a", "duration": 33.37, "q_en": "How do you like taking care of animals?", "a_en": "Well, I think taking care of animals is not an easy job because firstly it requires a great sense of responsibility and much time because Animals are physically weak and need to be carefully taken care of More importantly when taking care of animals We have to know useful skills in raising animals like how to feed animals, how to take care of animals when they're sick And these are the reasons why I think busy workers and students are usually not recommended to have pets", "q_zh": "你怎么看待照顾动物这件事？", "a_zh": "嗯，我认为照顾动物不是件容易的事，因为首先它需要很强的责任心和很多时间，动物身体柔弱、需要细心照料。更重要的是，照顾动物时我们必须掌握养动物的实用技能，比如怎么喂食、动物生病时怎么照顾。这也是我认为忙碌的上班族和学生通常不建议养宠物的原因。"}, {"n": 33, "idx": "033", "title": "033_part3带练33.m4a", "duration": 38.89, "q_en": "Do you think it is safe for animals to live in the cities?", "a_en": "Yeah, I think it's safe for pets like pet cats and pet dogs to live in the cities because there are strict rules and regulations in raising pets in cities. So pets will be well protected by their owners. Another thing is that some animal playground or parks are being built in many cities so animals can have an enjoyable life. Even those homeless dogs or cats can usually be well taken care of in the cities because there are some organizations which aim to create a place to save those abandoned animals.", "q_zh": "你认为动物生活在城市里安全吗？", "a_zh": "是的，我认为像宠物猫、宠物狗这样的宠物生活在城市里是安全的，因为城市里养宠物有严格的规章制度，所以宠物会得到主人很好的保护。另一点是，很多城市正在建动物游乐场或公园，所以动物能有愉快的生活。甚至那些流浪狗或流浪猫在城市里通常也能得到很好的照顾，因为有一些组织旨在创建地方来救助那些被遗弃的动物。"}, {"n": 34, "idx": "034", "title": "034_part3带练34.m4a", "duration": 36.9, "q_en": "What problems will keeping pets bring?", "a_en": "One main problem is that pets at their young age like at the first three months cannot control their behaviors like peeing and pooping in the living room chewing the shoes barking the midnight or destroying the furniture These behaviors are quite annoying another problem is that some people may be allergic to furry animals These may cause cough problems and raising a pet is nothing like keeping an animal in the cage we have to spend a lot of time on entertaining then so our work will study may be influenced", "q_zh": "养宠物会带来什么问题？", "a_zh": "一个主要问题是，宠物在幼年时期（比如头三个月）无法控制自己的行为，比如在客厅里大小便、咬鞋子、半夜吠叫或破坏家具，这些行为相当恼人。另一个问题是，有些人可能对毛茸茸的动物过敏，可能引起咳嗽问题。而且养宠物一点也不像把动物关在笼子里——我们得花大量时间逗它们玩，所以我们的工作或学习可能会受影响。"}, {"n": 35, "idx": "035", "title": "035_part3带练35.m4a", "duration": 42.47, "q_en": "How are pets now different from those in the past?", "a_en": "I think the biggest difference is the past nowadays they have longer life spans and they're much healthier than those in the past because pets owners usually feed them well. And another difference is about its relationship with owners. Pets in the past were used as guards protecting human houses and other properties but they're now being treated as important family members and have close relationships with owners. And now these pets are not confined to dogs and cats. There are various types of pets like lizards, snakes, spiders, llamas or even lions and tigers.", "q_zh": "现在的宠物和过去的宠物有什么区别？", "a_zh": "我认为最大的区别是，现在的宠物寿命更长、比过去的宠物健康得多，因为宠物主人通常把它们喂得很好。另一个区别是它们与主人的关系：过去的宠物被用作守卫，保护人类住宅和其他财产，但现在它们被当作重要的家庭成员，和主人关系亲密。而且现在的宠物不局限于狗和猫，有各种类型的宠物，比如蜥蜴、蛇、蜘蛛、羊驼甚至狮子和老虎。"}, {"n": 36, "idx": "036", "title": "036_part3带练36.m4a", "duration": 24.22, "q_en": "Which phone app is the most popular in your country?", "a_en": "In my country, I think the most popular app on the cell phone must be TikTok. It is so popular that all friends of mine and classmates around me have downloaded this app in their smartphones. Even the older generations like my parents and grandparents are using this app frequently, watching short videos almost every day.", "q_zh": "你们国家最流行的手机 App 是哪个？", "a_zh": "在我们国家，我认为手机上最流行的 App 一定是抖音。它太流行了，我所有的朋友和身边的同学都在智能手机上下载了它。甚至像我父母、祖父母这样的老一辈也在频繁使用这个 App，几乎每天都看短视频。"}, {"n": 37, "idx": "037", "title": "037_part3带练37.m4a", "duration": 34.81, "q_en": "Do you think parents should limit the time that their children spend on the phone?", "a_en": "Definitely, I think they should limit the time that their children spend on their cell phone. Because firstly, the children are too young, they don't have the self-control discipline. Cell phones, especially smartphones, are big distractions, and children may be obsessed with video games, novels, or online shopping, and could not concentrate on their study. And if there's no restrictions, children will spend too much time on cell phones, which is bad for their eyesight, made it to sedentary lifestyle and cause health problems.", "q_zh": "你认为父母应该限制孩子玩手机的时间吗？", "a_zh": "当然，我认为他们应该限制孩子花在手机上的时间。因为首先，孩子太小，没有自控自律能力。手机尤其是智能手机是很大的干扰，孩子可能沉迷于电子游戏、小说或网购，无法专注学习。而且如果没有限制，孩子会花太多时间在手机上，这对视力有害，还会导致久坐的生活方式并引发健康问题。"}, {"n": 38, "idx": "038", "title": "038_part3带练38.m4a", "duration": 34.3, "q_en": "Do you think people nowadays depend on phone naps too much?", "a_en": "Yeah, I think so I think nowadays people are relying too much on phone naps and even can't live without phone naps Because they're quite useful and functional and can make our lives much easier Convenient and more efficient and we use those phone naps very frequently since everything can be done on the phone For example people are getting used to ordering food on On phone naps instead of going to restaurant and We spend a lot of time watching short videos on cell phones", "q_zh": "你认为现在的人太依赖手机 App 了吗？", "a_zh": "是的，我认为是的。我认为现在的人太依赖手机 App，甚至离了手机 App 就活不下去。因为它们非常实用、功能强大，能让我们的生活轻松得多、方便又高效。我们非常频繁地使用这些 App，因为什么事都能在手机上完成。比如，人们习惯用手机 App 点外卖而不是去餐厅，我们花大量时间在手机上看短视频。"}, {"n": 39, "idx": "039", "title": "039_part3带练39.m4a", "duration": 29.79, "q_en": "Do you think some apps will help people to study?", "a_en": "Yes, now there are a lot of phone apps which can help us to study because they offer a lot of use for learning resources and There will be some public lessons and live classes on the apps So we can easily learn some new skills on those apps like languages, science and useful skills More importantly now. There's a lot of apps are free or reasonably priced People are helped a lot because they easily get access to online courses", "q_zh": "你认为有些 App 会帮助人们学习吗？", "a_zh": "是的，现在有很多手机 App 能帮我们学习，因为它们提供很多有用的学习资源，App 上会有一些公开课和直播课，所以我们可以轻松地在这些 App 上学到新技能，比如语言、科学和实用技能。更重要的是，现在很多 App 免费或价格合理，人们从中受益很多，因为他们能方便地获取在线课程。"}, {"n": 40, "idx": "040", "title": "040_part3带练40.m4a", "duration": 47.63, "q_en": "Why do people choose to travel by public transport?", "a_en": "Well, I think people travel by public transport primarily because it is more affordable and the public transport network now This is quite efficient. Many places are connected by buses or subways and most bus stations or subway stations are close to residential areas so people can easily travel to different places by public transport. Another reason is that there are fixed routes for public transport so it is usually faster and more convenient especially during rush hours or busy traffic. And some people choose to travel by public transport simply because it is eco-friendly, good for the environment.", "q_zh": "为什么人们选择乘公共交通出行？", "a_zh": "嗯，我认为人们乘公共交通出行，主要是因为它更实惠，而且现在的公共交通网络相当高效。很多地方由公交或地铁连接，大多数公交站或地铁站离居民区很近，所以人们可以方便地乘公共交通去不同地方。另一个原因是公共交通有固定路线，所以通常更快、更方便，尤其在高峰时段或交通拥堵时。还有一些人选择乘公共交通，纯粹是因为它环保、对环境友好。"}, {"n": 41, "idx": "041", "title": "041_part3带练41.m4a", "duration": 35.78, "q_en": "What are the disadvantages of traveling by public transport?", "a_en": "While talking about the disadvantages, I think the main disadvantage is that it is sometimes noisy crowded and less comfortable than taking private cars, especially when passengers are getting too close That is embarrassing and annoying Another drawback is public transport usually follows the design the routes and many fixed stops So it takes passengers a longer time to travel to a place by public transport because it cannot personalize or change the traveling routes", "q_zh": "乘公共交通出行有什么缺点？", "a_zh": "说到缺点，我认为主要缺点是它有时吵闹、拥挤，不如坐私家车舒适，尤其当乘客靠得太近时，那很尴尬、恼人。另一个缺点是公共交通通常遵循固定的路线和很多固定站点，所以乘客乘公共交通去一个地方要花更长时间，因为它无法个性化或改变出行路线。"}, {"n": 42, "idx": "042", "title": "042_part3带练42.m4a", "duration": 54.55, "q_en": "Do you think offering free public transport will solve traffic problems in the city?", "a_en": "To be honest, I don't think we'll solve the traffic problems in the city. Although public transport can help reduce traffic pressure, it doesn't necessarily mean that free public transport may encourage more people to use them. Because people don't use public transport, not because the high costs and nowadays the public transport is extremely low. What's worse, the main traffic problem in cities is crowdedness and this is mainly caused by the excessive reliance on private cars and those people who get used to using private cars would continue their preference because of cars convenience and flexibility. So the traffic problem can be better solved by the restriction in use of private cars instead of simply offering free public transport.", "q_zh": "你认为提供免费公共交通能解决城市交通问题吗？", "a_zh": "说实话，我不认为能解决城市交通问题。虽然公共交通能帮助减轻交通压力，但这并不意味着免费公共交通会鼓励更多人使用它。因为人们不使用公共交通，并不是因为费用高——现在公共交通已经极其便宜了。更糟的是，城市主要的交通问题是拥挤，而这主要是由对私家车的过度依赖造成的，那些习惯用私家车的人会继续偏好私家车，因为车方便、灵活。所以交通问题更应该通过限制私家车的使用来解决，而不是简单地提供免费公共交通。"}, {"n": 43, "idx": "043", "title": "043_part3带练43.m4a", "duration": 43.35, "q_en": "Why do more and more people like to travel by plane?", "a_en": "I think the main reason is that traveling by plane has become more affordable and less expensive than before and It is most efficient and convenient transportation means and people can go to a new city or a new country within several hours Another reason is that there are more airports than before so people can directly travel to their destinations without traveling to the nearby city first Moreover, it is also related to people's traveling preference More and more people prefer to travel to foreign countries and those places can only be reached by taking a plane", "q_zh": "为什么越来越多的人喜欢坐飞机旅行？", "a_zh": "我认为主要原因是，坐飞机旅行比以前更实惠、更便宜了，而且它是最高效、最方便的交通方式，人们能在几个小时内到达一个新城市或新国家。另一个原因是机场比以前多了，所以人们可以直接飞到目的地，而不必先到附近城市。此外，这也和人们的旅行偏好有关——越来越多的人喜欢去国外旅行，而那些地方只能坐飞机到达。"}, {"n": 44, "idx": "044", "title": "044_part3带练44.m4a", "duration": 39.17, "q_en": "Why should students wear school uniforms?", "a_en": "Well, I think the primary reason is that requiring all the students to wear school uniforms is a good way to encourage students to concentrate on their academic study, which of course is the main task for students because they don't need to spend too much time selecting clothes or talking about dressing styles every day. Another reason is that students show their identities by wearing school uniforms and it makes the school management easier and more organized, especially when there are group activities like sports competitions or volunteering work.", "q_zh": "为什么学生应该穿校服？", "a_zh": "嗯，我认为首要原因是，要求所有学生穿校服是鼓励学生专注于学业的好方式——学业当然也是学生的主要任务——因为他们不必每天花太多时间挑衣服或讨论穿衣风格。另一个原因是，学生通过穿校服展示自己的身份，让学校管理更容易、更有序，尤其是在体育比赛或志愿活动等集体活动中。"}, {"n": 45, "idx": "045", "title": "045_part3带练45.m4a", "duration": 39.55, "q_en": "On what occasion should people wear uniforms?", "a_en": "I think people usually wear uniforms on important occasions or special celebrations. For example, students often wear school uniforms when they take part in group activities like volunteering work, field trips, school openings or graduation ceremonies. For company staff, they are required to wear uniforms on formal meetings, anniversaries or exhibitions. Athletes usually show their identities by wearing uniforms when they are taking part in national or international competitions.", "q_zh": "人们应该在什么场合穿制服？", "a_zh": "我认为人们通常在重要场合或特殊庆典上穿制服。比如，学生参加志愿活动、实地考察、开学典礼或毕业典礼等集体活动时经常穿校服。对员工来说，他们被要求穿制服出席正式会议、周年庆或展会。运动员参加国内或国际比赛时通常通过穿制服来展示身份。"}, {"n": 46, "idx": "046", "title": "046_part3带练46.m4a", "duration": 47.21, "q_en": "Should companies ask for employees opinions about the design of the uniforms?", "a_en": "Yeah, I think so. I think it is a great idea to ask for employees opinions because there are the group who have personally Warned the uniforms and they clearly know the advantages and the flaws of the uniforms Like whether the uniform is comfortable or not whether the uniform restricts their daily work Therefore asking for employees opinions is a good way to improve their uniforms In addition, it shows the companies respect to their employees when their opinions are considered and eventually accepted They may regard themselves valuable to the organization and feel more motivated to work hard and contribute a lot", "q_zh": "公司应该就制服设计征求员工意见吗？", "a_zh": "是的，我认为应该。我认为征求员工意见是个好主意，因为他们是亲身穿过制服的人，清楚制服的优点和缺陷，比如制服是否舒适、是否影响日常工作。因此，征求员工意见是改进制服的好方式。此外，当员工的意见被考虑并最终采纳时，这体现了公司对员工的尊重，他们可能觉得自己对组织有价值，从而更有动力努力工作、做出贡献。"}, {"n": 47, "idx": "047", "title": "047_part3带练47.m4a", "duration": 34.07, "q_en": "Can people tell a person's personality by his or her clothes?", "a_en": "Definitely, we can't easily know a person's personality by his or her clothes. For example, if they are dressing in clothes in bright color like red, yellow, or green, they're probably more energetic and lively people. People who dress formally usually are professional workers. Dilling with everything seriously, people who prefer to a clothes made from silk or other natural fibers are generally gentle and graceful.", "q_zh": "人们能通过一个人的穿着判断他的性格吗？", "a_zh": "当然，我们不能轻易通过一个人的穿着知道他的性格。比如，如果他们穿红、黄、绿等亮色的衣服，他们可能更有活力、更活泼。穿着正式的人通常是职业人士，做事认真。偏爱丝绸或其他天然纤维衣物的人通常温柔优雅。"}, {"n": 48, "idx": "048", "title": "048_part3带练48-1.m4a", "duration": 45.63, "q_en": "What are the benefits of younger than older generations living together?", "a_en": "What I think the biggest advantage must be that they can take care of each other the older generation can help looking after their grandchildren doing housework and the younger generation can take better care of old people and send them to the hospital immediately when they are sick. Another benefit is that it is good for a family relationship. They are living together instead of being separated so they can communicate with each other face-to-face frequently and directly. And it strengthens family bonds. And it also helps reduce the living cost of the family since they can share the phone bills, electricity bills and the rents together. This is more cost-effective.", "q_zh": "年轻一代和年长一代住在一起有什么好处？", "a_zh": "我认为最大的好处一定是他们能互相照顾——老一辈可以帮忙照看孙辈、做家务，年轻一代可以更好地照顾老人，老人病了能立刻送医院。另一个好处是有利于家庭关系。他们住在一起而不是分开，所以可以频繁、直接地面对面交流，这加强了家庭纽带。它还有助于降低家庭生活成本，因为他们可以一起分摊电话费、电费和房租，这更划算。"}, {"n": 49, "idx": "049", "title": "049_part3带练48-2.m4a", "duration": 43.4, "q_en": "What are the drawbacks of younger and older generations living together?", "a_en": "The main drawback I think must be the younger generations may have different beliefs and ideas from the older generations So there are sometimes misunderstandings even arguments in addition Old people are used to living in the traditional way and are reluctant to make changes, you know But young people may stay up late or it irregally Living together would interfere with each other's life Another drawback is that young people may get used to relying on their parents or grandparents and become less independent And this is definitely harmful for young people's personal development", "q_zh": "年轻一代和年长一代住在一起有什么缺点？", "a_zh": "我认为主要缺点是，年轻一代可能和年长一代有不同的信念和想法，所以有时会有误解甚至争吵。此外，老人习惯于传统的生活方式，不愿做出改变；而年轻人可能熬夜或作息不规律。住在一起会互相干扰生活。另一个缺点是，年轻人可能习惯依赖父母或祖父母，变得不那么独立，这绝对有害于年轻人的个人发展。"}, {"n": 50, "idx": "050", "title": "050_part3带练49.m4a", "duration": 35.88, "q_en": "Which do you prefer support from family members or friends?", "a_en": "Why? Well, personally, I prefer to get support from my family because we're the closest relatives in the world and More importantly, they have much more social and life experience than my friends do and more powerful financially, so when I encounter some difficulties or problems Support from my family members can directly help me solve the problem and my friends are at a similar age as me And they may be struggling with their own problems and can now support me or help me", "q_zh": "你更喜欢来自家人的支持还是朋友的支持？为什么？", "a_zh": "嗯，就个人而言，我更喜欢从家人那里获得支持，因为我们是世上最亲近的亲人。更重要的是，他们比我的朋友有更多的社会和生活经验，经济上也更有能力，所以当我遇到困难或问题时，家人的支持能直接帮我解决问题。而我的朋友和我是相近的年龄，他们可能也在为自己的问题挣扎，不一定能支持或帮助我。"}, {"n": 51, "idx": "051", "title": "051_part3带练50.m4a", "duration": 46.74, "q_en": "Is it important to visit family members?", "a_en": "Why? I think it is quite important to with the family members. Firstly, nowadays most people are busy with their full-time work or study and are living in different cities and they have few opportunities to pay visits to family members. So visiting family members is a good way to increase the family communication and help maintain family ties. More importantly, since that the whole society is made up of millions of families. The strong family bonds can also strengthen national identity and make the society more united. And it is also a good relaxation because people may feel easy and warm and forget worries in work or study when staying with the family members.", "q_zh": "探望家人重要吗？为什么？", "a_zh": "我认为探望家人相当重要。首先，现在大多数人忙于全职工作或学习，生活在不同城市，很少有机会探望家人。所以探望家人是增加家庭交流、帮助维系家庭纽带的好方式。更重要的是，既然整个社会由数百万个家庭组成，牢固的家庭纽带也能强化民族认同、让社会更团结。而且它也是一种很好的放松，因为和家人待在一起时，人们会感到轻松温暖，忘掉工作或学习中的烦恼。"}, {"n": 52, "idx": "052", "title": "052_part3带练51.m4a", "duration": 26.91, "q_en": "What kind of people do you usually see in the news?", "a_en": "What I think in the news we frequently see famous people like politicians, pop stars or scientists because they can easily attract the public's attention and we usually see ordinary people in the social news like successful local businessmen, single-parent children or old people who have done great contributions to the community.", "q_zh": "你通常在新闻里看到什么样的人？", "a_zh": "我认为在新闻里我们经常看到名人，比如政客、流行歌手或科学家，因为他们能轻易吸引公众注意力。我们也常在社会新闻里看到普通人，比如成功的本地商人、单亲家庭的孩子，或为社区做出巨大贡献的老人。"}, {"n": 53, "idx": "053", "title": "053_part3带练52.m4a", "duration": 32.49, "q_en": "Are stories about celebrities in the news always true?", "a_en": "I think stories about celebrities like political figures, scientists, doctors or businessmen are generally true and trustworthy because there's no need for the editors to make up a fancy story. But stories about pop stars or superstars in entertainment industry are not always true or authentic because the editors may fabricate some stories to attract followers' attention and to make those stars more well known.", "q_zh": "新闻里关于名人的故事总是真实的吗？", "a_zh": "我认为像政治人物、科学家、医生或商人这类名人的故事通常真实可信，因为编辑没必要编造花哨的故事。但娱乐行业里流行歌手或巨星的故事并不总是真实或可信的，因为编辑可能会编造一些故事来吸引粉丝注意、让那些明星更出名。"}, {"n": 54, "idx": "054", "title": "054_part3带练53.m4a", "duration": 30.72, "q_en": "Is news often about famous people?", "a_en": "Why? As I've mentioned before, I think most news are about famous people like political figures and pop stars because they can attract public attention, therefore generate income and benefits to the press and editors. There are also stories about the government and ordinary people like children's education, medical care system, transportation, economic success or scientific developments are also frequently covered in news.", "q_zh": "新闻经常是关于名人的吗？为什么？", "a_zh": "正如我之前提到的，我认为大部分新闻是关于名人的，比如政治人物和流行歌手，因为他们能吸引公众注意，从而给媒体和编辑带来收入和利益。也有关于政府和普通人的故事，比如儿童教育、医疗体系、交通、经济成就或科学发展，这些也经常在新闻中被报道。"}, {"n": 55, "idx": "055", "title": "055_part3带练54.m4a", "duration": 36.53, "q_en": "Could superstar bring positive influence to the public?", "a_en": "I mean sure, they definitely bring a lot of positive influence to the public because now the celebrities are usually regarded as role models by young people. When pop stars actively participate in charity activities or volunteer work, their followers can also be encouraged to do something meaningful to the society. And the positive image of those superstars can also help the public form good lifestyles, and this is also one important reason why superstars are usually selected as spokesmen in public campaigns.", "q_zh": "超级明星能给公众带来正面影响吗？", "a_zh": "当然，他们绝对能给公众带来很多正面影响，因为现在名人通常被年轻人视为榜样。当流行歌手积极参与慈善活动或志愿工作时，他们的粉丝也能被鼓励去做一些对社会有意义的事。而且那些超级明星的正面形象也能帮助公众形成良好的生活方式，这也是超级明星通常被选为公共活动代言人的一个重要原因。"}, {"n": 56, "idx": "056", "title": "056_part3带练55.m4a", "duration": 41.63, "q_en": "What qualities does a person need to take care of no person?", "a_en": "What I think the most important quality must be patients and great sense of responsibility because as we all know most old people are physically weak and have age-related diseases And they usually have bad tempers and make people annoyed and irritated so I think if we were to look after old people we would have to be patients, at least not yelling or shouting at them And people also need to have some specialized skills like cooking, first aid knowledge I would say Basic medical treatment techniques because we have to make sure that old people are properly treated when some accidents happen", "q_zh": "照顾老人需要什么样的品质？", "a_zh": "我认为最重要的品质一定是耐心和强烈的责任感，因为我们都知道大多数老人身体虚弱、有与年龄相关的疾病，他们通常脾气不好、让人恼火。所以我认为如果我们照顾老人，就必须有耐心，至少不冲他们大喊大叫。人们还需要一些专业技能，比如烹饪、急救知识——我会说是基本医疗处理技术，因为我们必须确保在意外发生时老人得到妥善处理。"}, {"n": 57, "idx": "057", "title": "057_part3带练56-1.m4a", "duration": 31.19, "q_en": "Do you think old people should be taken care of at home?", "a_en": "Yes, I think so. I think most old people should be taken care of at home because for old people The feeling of family the most important. They will never feel isolated Lonely or depressed when they are taken care of at home Taking care of the not home is also more convenient and more enjoyable because family members are familiar with the lifestyles Let me have it some personalities Hence, there will be fewer arguments or conflicts", "q_zh": "你认为老人应该在家被照顾吗？", "a_zh": "是的，我认为应该。我认为大多数老人应该在家被照顾，因为对老人来说，家的感觉最重要。在家被照顾时，他们永远不会感到孤立、孤独或抑郁。在家照顾老人也更方便、更愉快，因为家人熟悉老人的生活方式和某些性格特点，因此争吵或冲突会更少。"}, {"n": 58, "idx": "058", "title": "058_part3带练56-2.m4a", "duration": 36.06, "q_en": "Do you think old people should be taking care of at home?", "a_en": "No, I don't think home is the best place Instead, I think old people should be taking care of at nursing homes because family members are usually busy with their full-time jobs And it is difficult for them to look after old people at home More importantly, there are well-trained doctors and nurses and also better medical facilities in nursing homes So old people can be better taken care of and they can also have happier life since they can make friends with other old people Instead of being isolated and feeling lonely at home", "q_zh": "你认为老人应该在家被照顾吗？（反方）", "a_zh": "不，我认为家不是最好的地方。相反，我认为老人应该在养老院被照顾，因为家人通常忙于全职工作，很难在家照顾老人。更重要的是，养老院有训练有素的医生和护士，还有更好的医疗设施，所以老人能得到更好的照顾，也能有更快乐的生活，因为他们可以和其他老人交朋友，而不是在家被孤立、感到孤独。"}, {"n": 59, "idx": "059", "title": "059_part3带练57.m4a", "duration": 30.4, "q_en": "How can people in the neighborhood help old people?", "a_en": "I think the most useful approach is to organize group activities in the community like dancing competitions, parties, or organizing some learning club activities in reaching old people's life and making them more integrated into the society. And family visit is another way to help old people because we can know their needs and difficulties better and their relationship with neighbors are strengthened.", "q_zh": "邻里怎么帮助老人？", "a_zh": "我认为最有用的方法是在社区组织集体活动，比如舞蹈比赛、聚会，或组织一些学习俱乐部活动，丰富老人的生活，让他们更好地融入社会。家庭探访是另一种帮助老人的方式，因为我们可以更好地了解他们的需求和困难，并加强他们与邻居的关系。"}, {"n": 60, "idx": "060", "title": "060_part3带练58.m4a", "duration": 39.13, "q_en": "Which one do you think is more important individual development or team schools?", "a_en": "Personally, I think team schools are much more important because now they most work out done by a team instead of a single individual So when a team have a common goal every team member is going to be motivated to work hard and to achieve the goal and Working together means high efficiency and productivity Anything can be accomplished when we are working as a team Teamwork can also contribute to personal development Teamwork participants are more competitive and have better communication and cooperation ability", "q_zh": "你认为个人发展和团队协作哪个更重要？", "a_zh": "就个人而言，我认为团队协作重要得多，因为现在大多数工作是由团队而非单个人完成的。所以当一个团队有共同目标时，每个成员都会被激励去努力达成目标，一起工作意味着高效率和生产力。当我们作为团队合作时，什么事都能完成。团队协作也有助于个人发展——团队协作的参与者更有竞争力，有更好的沟通和合作能力。"}, {"n": 61, "idx": "061", "title": "061_part3带练59.m4a", "duration": 34.48, "q_en": "Do you think it is a good thing to have disagreements within a team?", "a_en": "Yes, I think disagreements in the team must be a very positive thing And you know disagreements mean that some people have different opinions and they are thinking thoroughly about the problem And they're actually real participants rather than viewers by the side So when team members have disagreements, we can have some group discussions and persuade them in the right way Find out the best solution, and find out each an agreement This is good for team's development", "q_zh": "你认为团队内有分歧是好事吗？", "a_zh": "是的，我认为团队内的分歧一定是非常积极的事。分歧意味着有些人有不同意见，他们在彻底思考问题，实际上是真正的参与者而不是旁观者。所以当团队成员有分歧时，我们可以进行小组讨论，用正确的方式说服对方，找出最佳方案，达成一致。这对团队发展有好处。"}, {"n": 62, "idx": "062", "title": "062_part3带练60.m4a", "duration": 38.15, "q_en": "Do you think it is good for kids to join the team?", "a_en": "Yeah, definitely. I think kids should participate in team activities as much as possible. Because now the teamwork spirit is greatly valued in school and future career. Kids who perform well in team projects are usually good problem solvers and decision makers in the future. More importantly, children can benefit a lot from team activities. I mean, they can know how to cooperate with other team members, how to communicate with other children to find out the best solution. And it is also good for children's personalities because teamwork makes children more open-minded and optimistic.", "q_zh": "你认为孩子参加团队活动好吗？", "a_zh": "是的，当然好。我认为孩子应该尽可能多地参加团队活动，因为现在团队精神在学校和未来职业中都很受重视。在团队项目中表现出色的孩子，将来通常是好的问题解决者和决策者。更重要的是，孩子能从团队活动中受益良多，我是说，他们能学会如何与其他成员合作、如何与其他孩子沟通以找出最佳方案。这对孩子的性格也有好处，因为团队协作让孩子更开放、更乐观。"}, {"n": 63, "idx": "063", "title": "063_part3带练61.m4a", "duration": 36.43, "q_en": "How to become a good member of a team in the workplace?", "a_en": "I think the first step is awareness. First, they should know the importance of teamwork activities. They should know that teamwork will bring the greatest benefit to the whole team. Second, I think most of the time they should follow the instructions of the leader. But if they have disagreements, they ought to communicate with the leader and have good cooperation with other team members. So that the team can achieve the goal more efficiently. And team members who are responsible, hard-working, productive, are good team members in my opinion.", "q_zh": "如何在职场成为一个好的团队成员？", "a_zh": "我认为第一步是意识。首先，他们应该知道团队活动的重要性，应该知道团队协作会给整个团队带来最大利益。其次，我认为大多数时候他们应该听从领导的指示。但如果他们有分歧，就应该与领导沟通，并与其他团队成员良好合作，这样团队能更高效地达成目标。在我看来，负责任、勤奋、高效的团队成员就是好的团队成员。"}, {"n": 64, "idx": "064", "title": "064_part3带练62.m4a", "duration": 41.31, "q_en": "Which do you prefer family firms or non-family ones?", "a_en": "What I personally prefer working in non-family firms because if I work in family firms There are complicated relationships since a lot of departments are usually managed by family members or relatives And I can't hardly get promoted to important positions But non-family firms can create transparent and more competitive working environments where everything is fair and everyone is equally treated Unlike the family firms which are controlled by family power, non-family firms are operated under clear rules and regulations Regardless of the family rankings or relationships", "q_zh": "你更喜欢家族企业还是非家族企业？", "a_zh": "我个人更喜欢在非家族企业工作，因为如果在家族企业工作，关系会很复杂——很多部门通常由家族成员或亲属管理，我很难被提拔到重要职位。而非家族企业能创造透明、更有竞争力的工作环境，那里一切公平、人人平等对待。与由家族权力控制的家族企业不同，非家族企业在明确的规章制度下运营，不论家族等级或关系。"}, {"n": 65, "idx": "065", "title": "065_part3带练63.m4a", "duration": 41.96, "q_en": "What are important factors in making a company successful?", "a_en": "I think the most important factor in making a company successful is valuable human resources because good employees are more productive and more responsible and will create more profits for the company. A competent leader and good teamwork environment are also crucial factors which can ensure that workers have better cooperation and can achieve goals more efficiently. The high quality products and services are determined in factors of a company's success. If the products and services meet customers' needs and make their life better, the company will achieve a huge success.", "q_zh": "让一家公司成功的重要因素是什么？", "a_zh": "我认为让公司成功最重要的因素是有价值的人力资源，因为好员工更高效、更负责，会为公司创造更多利润。一位有能力的领导和良好的团队协作环境也是关键因素，能确保员工更好地合作、更高效地达成目标。高质量的产品和服务也是公司成功的决定性因素——如果产品和服务满足客户需求、让他们的生活更好，公司就会取得巨大成功。"}, {"n": 66, "idx": "066", "title": "066_part3带练64.m4a", "duration": 45.02, "q_en": "What kinds of qualities should a successful business man have?", "a_en": "I think successful business man should be smart, sensitive, and hardworking, clearly knowing what the market wants and what consumers really need. And when they have a goal or target, they try the best and use different kinds of resources or methods to achieve a goal. And they should persist in their goal, despite some difficulties. Secondly, I think successful business man should be good at communicating so that they can motivate their employees to be more enthusiastic in their work and become more productive and responsible. Finally, successful business man should also be courageous to take risks, embrace novelty and be creative and innovative.", "q_zh": "一个成功的商人应该具备什么样的品质？", "a_zh": "我认为成功的商人应该聪明、敏锐、勤奋，清楚知道市场想要什么、消费者真正需要什么。当他们有目标时，会尽最大努力、运用不同资源或方法去达成。而且他们应该在面对困难时坚持目标。其次，我认为成功的商人应该善于沟通，这样能激励员工更热情地工作，变得更高产、更负责。最后，成功的商人还应该有勇气冒险，拥抱新事物，有创意和创新精神。"}, {"n": 67, "idx": "067", "title": "067_part3带练65.m4a", "duration": 39.36, "q_en": "What emerging industries do you know?", "a_en": "I think the most prosperous emerging industry must be artificial intelligence. It is frequently used and has successfully made our life and work more efficient and convenient. This industry has become an industry with billions of dollars' value. Electric car manufacturing is another emerging industry that has a promising future because it brings benefits to both users and the environment. The emerging industry I have to mention is the Wii Media which enables ordinary people to be well known and famous and bloggers can also make a profit from using this website.", "q_zh": "你知道哪些新兴产业？", "a_zh": "我认为最繁荣的新兴产业一定是人工智能。它被频繁使用，成功地让我们的生活和工作更高效、更方便，这个产业已成为价值数十亿美元的产业。电动汽车制造是另一个有光明前景的新兴产业，因为它给用户和环境都带来好处。我必须提到的另一个新兴产业是自媒体，它让普通人能被熟知、出名，博主也能通过使用这个平台获利。"}, {"n": 68, "idx": "068", "title": "068_part3带练66.m4a", "duration": 29.05, "q_en": "Do teens like doing sports in your country?", "a_en": "Yeah, I think the teenagers in my country really like doing sports. Firstly, you know, they are required to take PE classes in primary and middle school because it is a compulsory subject. They enjoy playing basketball, football or swimming, and they can do a lot of outdoor activities. And also, they like doing sports because doing sports makes them more energetic and refreshed and helps them release a stress from academic work.", "q_zh": "你们国家的青少年喜欢运动吗？", "a_zh": "是的，我认为我们国家的青少年真的很喜欢运动。首先，他们在中小学被要求上体育课，因为它是必修科目。他们喜欢打篮球、踢足球或游泳，可以做很多户外活动。而且，他们喜欢运动是因为运动让他们更有活力、精神焕发，帮助释放学业压力。"}, {"n": 69, "idx": "069", "title": "069_part3带练67.m4a", "duration": 30.35, "q_en": "Is doing sports beneficial?", "a_en": "Yes, I think doing sports is quite beneficial both physically and mentally. On one hand, we can keep fit and improve our health conditions by doing sports so that our immune system will be strengthened and we're more resistant to disease or even epidemics. On the other hand, we can have a strong will through doing sports so that when we are doing some tough tasks, we're more likely to persist and insist. On the other hand, we can have a strong will through doing sports.", "q_zh": "做运动有益处吗？", "a_zh": "是的，我认为做运动在身体和精神上都相当有益。一方面，我们可以通过做运动保持健康、改善健康状况，这样我们的免疫系统会增强，更能抵抗疾病甚至流行病。另一方面，我们可以通过做运动获得坚强的意志，这样在做一些艰巨任务时，我们更可能坚持到底。"}, {"n": 70, "idx": "070", "title": "070_part3带练68.m4a", "duration": 28.21, "q_en": "Can you keep fit by doing sports?", "a_en": "Sure, I think doing sports really is the best way to keep fit because it can not only reduce fat Consume calories and also build our muscles So as I've mentioned before we're less likely to have diseases and people who do sports regularly are usually healthier and more Inthusiastic and I think that is why many young people are encouraged to sports to keep fit", "q_zh": "你能通过做运动保持健康吗？", "a_zh": "当然，我认为做运动确实是保持健康的最佳方式，因为它不仅能减脂、消耗卡路里，还能锻炼我们的肌肉。所以正如我之前提到的，我们更不容易生病，经常做运动的人通常更健康、更有活力。我认为这就是为什么很多年轻人被鼓励通过运动来保持健康。"}, {"n": 71, "idx": "071", "title": "071_part3带练69.m4a", "duration": 33.74, "q_en": "What are the advantages of children joining sports groups?", "a_en": "What I think that joining sports groups means children have to do sports together as a team so that they can have common goals and try the best to achieve the goals to win the games or the competitions. So of course, children can develop teamwork spirits through joining sports groups. Another advantage is that children have more opportunities to communicate with the team members when they are in the group. So they can make more friends and improve their communicative skills if they join sports groups.", "q_zh": "孩子参加运动团体有什么好处？", "a_zh": "我认为参加运动团体意味着孩子必须作为一个团队一起运动，这样他们能有共同目标，尽最大努力达成目标、赢得比赛或竞赛。所以当然，孩子能通过参加运动团体培养团队精神。另一个好处是，孩子在团体中有更多机会与成员交流，所以如果他们参加运动团体，能交到更多朋友、提高沟通技巧。"}, {"n": 72, "idx": "072", "title": "072_part3带练70.m4a", "duration": 30.91, "q_en": "What can we learn from our mistakes?", "a_en": "Well, firstly, I think we can learn a lesson, learn some useful experience from our mistakes. We can clearly figure out the causes and the consequences of our mistakes and then try to correct our behaviors and adjust our strategies. So we'll do a better job next time. Apart from that, we can learn something new like a new skill and learn to view something from a different perspective. And we'll become more motivated to try something more challenging. And we'll become more motivated to try something more challenging.", "q_zh": "我们能从错误中学到什么？", "a_zh": "嗯，首先我认为我们能从错误中吸取教训、学到一些有用的经验。我们能清楚找出错误的原因和后果，然后尝试纠正行为、调整策略，这样下次会做得更好。除此之外，我们能学到新东西，比如一项新技能，学会从不同角度看问题。而且我们会更有动力去尝试更有挑战性的事。"}, {"n": 73, "idx": "073", "title": "073_part3带练71.m4a", "duration": 28.07, "q_en": "Do children make mistakes easily?", "a_en": "Yes, I think so. I think children always make mistakes easily because they're immature intellectually, which means they cannot control their own behaviors very well And they can't distinguish right from wrong directly So sometimes they can be easily misled to do some wrong behaviors and make mistakes and It is common that some children make mistakes just because they're cheated by games candy or toys", "q_zh": "孩子容易犯错吗？", "a_zh": "是的，我认为是的。我认为孩子总是容易犯错，因为他们在智力上不成熟，这意味着他们不能很好地控制自己的行为，也不能直接分辨对错。所以有时他们容易被误导去做一些错误行为、犯错误。有些孩子犯错，仅仅是因为被游戏、糖果或玩具骗了，这很常见。"}, {"n": 74, "idx": "074", "title": "074_part3带练72.m4a", "duration": 42.1, "q_en": "What should parents do if their children make mistakes?", "a_en": "I think firstly parents should correct their behaviors by telling their children what is right and what is wrong. What other causes and consequences of the mistakes so that their children will recognize their mistakes and correct them next time. Verbal blames and physical maltreatment are in advisable because children are emotionally weak and these may make them unconfident and aggressive. Instead parents should encourage their children to take some risks to try something new although it will lead to some mistakes. By the way parents in their daily life should also say good examples for the children.", "q_zh": "如果孩子犯错了，父母应该怎么做？", "a_zh": "我认为首先父母应该通过告诉孩子什么是对、什么是错，以及错误的原因和后果，来纠正他们的行为，这样孩子会认识到自己的错误并在下次改正。言语责备和体罚是不可取的，因为孩子在情感上很脆弱，这些可能让他们不自信、有攻击性。相反，父母应该鼓励孩子去冒一些险、尝试新事物，即使这会导致一些错误。顺便说一句，父母在日常生活中也应该为孩子树立好榜样。"}, {"n": 75, "idx": "075", "title": "075_part3带练73.m4a", "duration": 38.57, "q_en": "What's the difference between watching performance live and watching it on TV?", "a_en": "I think the biggest difference is about the personal experience. Watching live performances apparently more exciting and interesting, and viewers can feel the atmosphere directly. But watching performance on TV is relatively less interactive and there are better visual and sound effects if we are watching a performance in theater, but watching the TV show is easier and more convenient. Another difference is the cost of course TV performance is free, but we have to buy tiff tickets if we go to enjoy a live performance.", "q_zh": "现场看演出和看电视上的演出有什么区别？", "a_zh": "我认为最大的区别在于个人体验。现场看演出显然更激动人心、更有趣，观众能直接感受氛围。但在电视上看演出相对互动性较少；如果在剧院看演出，有更好的视觉和音响效果，但看电视节目更简单、更方便。另一个区别当然是成本——电视演出免费，但去看现场演出得买票。"}, {"n": 76, "idx": "076", "title": "076_part3带练74.m4a", "duration": 46.42, "q_en": "Should government provide financial support to promote traditional performance?", "a_en": "Sure, I think governments should provide financial support to promote traditional performance. Firstly, traditional performance is an important part of a country's culture and represents national identity. So the government, of course, have the responsibility to preserve traditional art and ensure that traditional cultures pass to the younger generations. Secondly, traditional performance nowadays is less popular and it's not a mainstream culture, so it cannot create too much profit by itself, so they need the financial support from federal or local government to flourish. Otherwise, it may be replaced by Western cultures and eventually lost.", "q_zh": "政府应该为推广传统表演提供财政支持吗？", "a_zh": "当然，我认为政府应该为推广传统表演提供财政支持。首先，传统表演是一个国家文化的重要组成部分，代表民族身份，所以政府当然有责任保护传统艺术、确保传统文化传承给年轻一代。其次，如今传统表演不那么流行、不是主流文化，所以它本身无法创造太多利润，因此需要中央或地方政府的财政支持才能繁荣，否则它可能被西方文化取代并最终消失。"}, {"n": 77, "idx": "077", "title": "077_part3带练75.m4a", "duration": 35.83, "q_en": "Is learning drama or dancing helpful for children?", "a_en": "Yeah, I think so. I think it's always a good thing for children to learn some arts drama and dancing Which can help children develop a sense of art and beauty and they may become more confident if they are good at dancing or drama In addition, drama and dancing are hobbies which can enrich children's leisure time And they can make friends with people who share the same interests with them or entertain themselves while they're bored Therefore, I think children should be encouraged to learn dancing or drama if they are interested in them", "q_zh": "学戏剧或舞蹈对孩子有帮助吗？", "a_zh": "是的，我认为是的。我认为孩子学一些艺术——戏剧和舞蹈——总是好事，这能帮孩子培养艺术和美感，如果他们擅长舞蹈或戏剧，可能会更自信。此外，戏剧和舞蹈是能丰富孩子闲暇时间的爱好，他们可以和有相同兴趣的人交朋友，或在无聊时自娱自乐。因此，我认为如果孩子对舞蹈或戏剧感兴趣，应该鼓励他们学习。"}, {"n": 78, "idx": "078", "title": "078_part3带练76.m4a", "duration": 33.0, "q_en": "How can we avoid wasting time?", "a_en": "I think the most useful way is that we can make daily schedules for ourselves. So we can divide the whole project into several small tasks and finish the tasks one by one, making the most out of our time and finishing our tasks more quickly and efficiently. And also, now that we use our smartphones frequently and it has become an annoying distraction in our daily life and work. So I think limiting our time on using the cellphone is also a good way for us to save our time.", "q_zh": "我们怎样才能避免浪费时间？", "a_zh": "我认为最有用的方法是我们能为自己制定日程表。这样我们可以把整个项目分成几个小任务，逐个完成，充分利用时间，更快、更高效地完成任务。而且，既然我们频繁使用智能手机、它已成为我们日常生活和工作中恼人的干扰，我认为限制使用手机的时间也是节省时间的好方法。"}, {"n": 79, "idx": "079", "title": "079_part3带练77.m4a", "duration": 37.83, "q_en": "is time management important?", "a_en": "Yes, I think nowadays in this rapidly developing and stressful society, the time management skill is extremely important. If we were good at managing our time, we can finish our tasks more efficiently and make ourselves more productive. So it will also give us an opportunity to have enough time to have some relaxations and to have gatherings with family. Secondly, time management means high efficiency and productivity. Those people who manage time well are definitely more competitive and more likely to get promoted.", "q_zh": "时间管理重要吗？", "a_zh": "是的，我认为如今在这个快速发展、高压的社会，时间管理技能极其重要。如果我们善于管理时间，就能更高效地完成任务、让自己更高产，这样也能给我们机会有足够时间放松、与家人聚会。其次，时间管理意味着高效率和生产力。那些管理好时间的人绝对更有竞争力、更可能获得晋升。"}, {"n": 80, "idx": "080", "title": "080_part3带练78.m4a", "duration": 49.25, "q_en": "Should parents help children manage time?", "a_en": "I think parents need to help their children manage that time because their children are at their young age and lack self-controllability and are usually distracted by some external temptations like video games and TV programs So children need their parents to help them make a timetable so that they can just follow the schedule and finish the tasks one by one They therefore can be better on Concentrate on their study instead of wasting time on doing all necessary tasks and parents know the children's personality daily routines and learning habits So a reasonably designed timetable can ensure that children not only finish their work efficiently But also get enough time to develop their hobbies to do outdoor activities and to have fun with their friends", "q_zh": "父母应该帮孩子管理时间吗？", "a_zh": "我认为父母需要帮孩子管理时间，因为孩子年幼、缺乏自控力，通常会被电子游戏和电视节目等外部诱惑分心。所以孩子需要父母帮他们制定时间表，这样他们就能照表逐项完成任务，从而更好地专注学习，而不是把时间浪费在做非必要的事情上。而且父母了解孩子的性格、日常作息和学习习惯，所以合理设计的时间表能确保孩子不仅高效完成作业，还有足够时间培养爱好、做户外活动、和朋友玩耍。"}, {"n": 81, "idx": "081", "title": "081_part3带练79.m4a", "duration": 37.46, "q_en": "Do you think relaxing is a waste of time?", "a_en": "No, I don't think so. Instead, I think relaxing is a really good way to make us more productive. After a long time stressful and repetitive work of study, you really need a period of time to relax ourselves. It seems that we're doing something meaningless and insignificant when we are relaxing, like doing sports, listening to music or just having fun with friends. But relaxation enables us to have a clear reminder and finish our work more efficiently and quickly after relaxation. And this is also the reason why we have two days off every week.", "q_zh": "你认为放松是浪费时间吗？", "a_zh": "不，我不这么认为。相反，我认为放松是让我们更高产的好方法。在长时间高压、重复的工作或学习之后，你确实需要一段时间来放松自己。我们放松时，看起来像在做无意义、不重要的事，比如做运动、听音乐或和朋友玩。但放松能让我们头脑清醒，在放松之后更高效、更快地完成工作。这也是我们每周有两天假的原因。"}, {"n": 82, "idx": "082", "title": "082_part3带练80.m4a", "duration": 33.79, "q_en": "What kind of job do young people prefer?", "a_en": "I think in my country most young people prefer jobs that give them stable income, good working environment, and good working prospects. So, a lot of people prefer to be doctors, teachers, or government officers. And some young people prefer to be self-employed and start their own business because this kind of job is more challenging and may give them great sense of achievement. Being a freelance like an independent designer or a writer is also quite preferable among young people I will say.", "q_zh": "年轻人喜欢什么样的工作？", "a_zh": "我认为在我们国家，大多数年轻人喜欢能给他们稳定收入、良好工作环境和良好职业前景的工作。所以很多人喜欢当医生、老师或公务员。有些年轻人喜欢自主创业、开自己的公司，因为这类工作更有挑战性，可能给他们巨大的成就感。做一个自由职业者，比如独立设计师或作家，在年轻人中也相当受欢迎，我会说。"}, {"n": 83, "idx": "083", "title": "083_part3带练81.m4a", "duration": 38.38, "q_en": "Which do you prefer physical work or brain work?", "a_en": "I Would definitely choose brain work because I'm not physically strong enough to be qualified as a construction worker a plumber or an Electrician because this kind of job is usually too physically demanding and I have completed my four-year university study and I think I'm capable of doing Brain work which requires both high intelligence and good academic ability and I feel more fulfilled and motivated and Doing brain work and I prefer to do office work in a good indoor environment rather than do physical work outdoors", "q_zh": "你更喜欢体力工作还是脑力工作？", "a_zh": "我绝对会选择脑力工作，因为我身体不够强壮，没资格当建筑工人、水管工或电工，因为这类工作通常对体力要求太高。而我完成了四年大学学业，我认为自己有能力做需要高智商和良好学术能力的脑力工作。做脑力工作时我感到更充实、更有动力，而且我更喜欢在良好的室内环境做办公室工作，而不是在户外做体力工作。"}, {"n": 84, "idx": "084", "title": "084_part3带练82.m4a", "duration": 34.76, "q_en": "What factors should people take into consideration when choosing jobs?", "a_en": "I think the first factor most people would consider must be salary or working environment. As we all know, we work because we need a stable income to support ourselves or our families. Working environment is also quite important because everybody wants to work in a relaxing environment. Relationship with colleagues, team goals and cooperation with the team leader are also important factors that are usually taken into account when people choose a job.", "q_zh": "人们选择工作时应该考虑哪些因素？", "a_zh": "我认为大多数人会考虑的第一个因素一定是薪水或工作环境。我们都知道，我们工作是因为需要稳定收入来养活自己或家人。工作环境也相当重要，因为每个人都想在轻松的环境中工作。与同事的关系、团队目标和与团队领导的合作，也是人们选工作时通常会考虑的重要因素。"}, {"n": 85, "idx": "085", "title": "085_part3带练83.m4a", "duration": 46.0, "q_en": "Do people nowadays like to leave their hometown to work in other cities?", "a_en": "Yeah, I think so now there's a lot of people especially young people like to work in big cities like Beijing or Shanghai instead of working in the hometowns Because there are more job opportunities in big cities They're working in a competitive environment where they're able to work with competent people Which is also good for their future career development? In addition, working in big cities helps broaden their views because new innovations and fresh ideas or concepts usually first start from those highly developed cities But when people are at their 40s or 50s, they may leave those big cities and return to the hometowns to enjoy a more peaceful and relaxing life", "q_zh": "现在的人喜欢离开家乡去其他城市工作吗？", "a_zh": "是的，我认为是的。现在有很多人，尤其是年轻人，喜欢去北京、上海等大城市工作，而不是在家乡工作。因为大城市有更多工作机会，他们在有竞争的环境中工作，能够和有实力的人共事，这对他们未来的职业发展也有好处。此外，在大城市工作有助于开阔视野，因为新创新、新想法或新概念通常先从那些高度发达的城市开始。但当人们到了四五十岁，他们可能会离开那些大城市、回到家乡，享受更平静放松的生活。"}, {"n": 86, "idx": "086", "title": "086_part3带练84.m4a", "duration": 38.43, "q_en": "What are the qualities and personalities required for being a volunteer?", "a_en": "One most importantly, I think those people should be enthusiastic and passionate because when we're doing voluntary work, we may encounter different problems and different kinds of people. Of course, we have to be patient and enthusiastic and solving problems on finding our solutions. And another important quality is teamwork experience and communication skills because we're usually working as a group when we are doing a volunteering project. We have to communicate and cooperate with people from different backgrounds.", "q_zh": "做志愿者需要什么样的品质和性格？", "a_zh": "最重要的，我认为这些人应该热情、有激情，因为做志愿工作时，我们可能遇到不同的问题和不同的人，当然必须耐心、热情地解决问题、找到办法。另一个重要品质是团队协作经验和沟通技巧，因为做志愿项目时我们通常作为团队工作，必须与来自不同背景的人沟通合作。"}, {"n": 87, "idx": "087", "title": "087_part3带练85.m4a", "duration": 34.16, "q_en": "How can companies engage in volunteering to help our society?", "a_en": "The most important and direct way I think is that companies can supply funds and resources to make volunteering work easier and the more convenient. For example, companies can buy good equipment or store facilities enabling the community to be a better living place. And another way is that companies should organize volunteering activities regularly like monthly or annually so that their employees will be more passionate and enthusiastic in this kind of community service.", "q_zh": "公司如何参与志愿服务来帮助社会？", "a_zh": "我认为最重要、最直接的方式是公司能提供资金和资源，让志愿工作更容易、更方便。比如，公司可以购买好的设备或储物设施，让社区成为更好的居住地。另一种方式是公司应该定期组织志愿活动，比如每月或每年，这样员工会对这类社区服务更热心、更有热情。"}, {"n": 88, "idx": "088", "title": "088_part3带练86.m4a", "duration": 30.86, "q_en": "Do you think people nowadays should participate more in volunteering?", "a_en": "Yes, definitely. I think people especially young people should be encouraged to do more volunteering work. On one hand, they can put their knowledge, they have learning schools into practice helping to solve practical problems. On the other hand, people can also learn something new from this experience from other people and will become more socially responsible and are more likely to make contributions to the society. On the other hand, people can learn something new from this experience from other people and will become more socially responsible and are more likely to make contributions to the society.", "q_zh": "你认为现在的人应该更多地参与志愿服务吗？", "a_zh": "是的，当然。我认为应该鼓励人们尤其是年轻人做更多志愿工作。一方面，他们可以把在学校学到的知识付诸实践，帮助解决实际问题。另一方面，人们也能从这段经历中向他人学到新东西，会变得更有社会责任感，更可能为社会做贡献。"}, {"n": 89, "idx": "089", "title": "089_part3带练87.m4a", "duration": 38.94, "q_en": "How do more than technologies assist volunteer and volunteering experience?", "a_en": "Well, I think those applications on our smartphones can make the volunteering more intriguing and better known by the public and Can attract participants from different backgrounds and different cities so That we will call for more people to do volunteering work and more importantly more than technologies make volunteering work easier and more efficient For example artificial intelligence can create Virtual classrooms where volunteers of students can directly interact without carrying out teaching activities in real classrooms", "q_zh": "科技如何帮助志愿服务和志愿体验？", "a_zh": "嗯，我认为智能手机上的那些应用能让志愿服务更有趣、被更多人知晓，能吸引来自不同背景和不同城市的参与者，这样我们会号召更多人做志愿工作。更重要的是，科技让志愿工作更容易、更高效。比如，人工智能能创建虚拟教室，学生志愿者可以直接互动，而不必在真实教室里开展教学活动。"}, {"n": 90, "idx": "090", "title": "090_part3带练88.m4a", "duration": 27.05, "q_en": "Who is the head of the family in your culture?", "a_en": "While in Chinese culture, the husband is traditionally regarded as the head of the family because they are usually more physically powerful and are good at decision making. But if we are living with the old generations, the head of the family must be the father of the husband. Nowadays, women's wisdom is highly appreciated and many important decisions are made after the discussions between the couples.", "q_zh": "在你们的文化里，谁是家庭的一家之主？", "a_zh": "在中国文化里，丈夫传统上被视为一家之主，因为他们通常身体更强壮、善于做决定。但如果我们和长辈住在一起，一家之主一定是丈夫的父亲。如今，女性的智慧受到高度赞赏，很多重要决定是夫妻讨论后做出的。"}, {"n": 91, "idx": "091", "title": "091_part3带练89.m4a", "duration": 37.08, "q_en": "Are men better at decision-making in the family?", "a_en": "In most cases, men are the better decision-maker in the family. The first reason is that men usually have full-time jobs and have more social experience. They can consider the problem from different perspectives and try to seek out the best solution. Another reason is related to the personality. Men are usually less emotional and are less likely to make decisions irrationally and impulsively. In family, men usually make decisions in important issues like purchasing a house or doing financial investments.", "q_zh": "男性在家庭中更善于做决定吗？", "a_zh": "在大多数情况下，男性是家庭中更好的决策者。第一个原因是男性通常有全职工作，有更多社会经验，他们能从不同角度考虑问题、努力找出最佳方案。另一个原因与性格有关，男性通常没那么情绪化，不太可能不理性、冲动地做决定。在家庭中，男性通常在买房或做金融投资等重要问题上做决定。"}, {"n": 92, "idx": "092", "title": "092_part3带练90.m4a", "duration": 49.72, "q_en": "Should leader discuss with team members when making decisions?", "a_en": "Yes, I think so. First of all, the work is done by all the group members, not just the leader. So when making decisions, the leader has the responsibility to have discussions with other team members and this can also make team members feel that their opinions are appreciated and become more responsible and enthusiastic in group projects. More importantly, team members are real participants who clearly know every single process of the whole teamwork. So their opinions or suggestions are quite crucial to the success of a team project. If the leader fails to discuss the issue with team members, they may make a bad decision and eventually cause big losses to the whole team.", "q_zh": "领导做决定时应该和团队成员讨论吗？", "a_zh": "是的，我认为应该。首先，工作是所有团队成员完成的，不只是领导。所以做决定时，领导有责任与其他成员讨论，这也能让成员感到自己的意见受到重视，在团队项目中变得更负
